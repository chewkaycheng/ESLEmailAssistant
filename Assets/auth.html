<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization Complete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CWStudio Fluent UI color palette */
        :root {
            --fluent-bg: #ffffff;
            --fluent-text: #242424;
            --fluent-primary: #0F6CBD;
            --fluent-primary-dark: #0A5A99;
            --fluent-bg-hover: #F5F5F5;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fluent-bg: #292929;
                --fluent-text: #FFFFFF;
                --fluent-primary: #479EF5;
                --fluent-primary-dark: #2F80D0;
                --fluent-bg-hover: #3D3D3D;
            }
        }
        body {
            background-color: var(--fluent-bg);
            color: var(--fluent-text);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Segoe UI Web Fallback', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: var(--fluent-bg);
            color: var(--fluent-text);
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: #E7F3FF;
            color: #0F6CBD;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        @media (prefers-color-scheme: dark) {
            .icon-wrap {
                background: #1F3A5C;
                color: #479EF5;
            }
        }
        h1 {
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        p {
            margin: 0 0 28px 0;
            font-size: 15px;
            color: #666666;
            line-height: 1.5;
        }
        @media (prefers-color-scheme: dark) {
            p { color: #B0B0B0; }
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px 20px;
            background: var(--fluent-primary);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s ease, transform 0.05s ease;
        }
        .btn:hover {
            background: var(--fluent-primary-dark);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .hint {
            margin-top: 24px;
            font-size: 13px;
            color: #999999;
            text-align: center;
        }
        @media (prefers-color-scheme: dark) {
            .hint { color: #777777; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1>Authorization Complete</h1>
        <p>You have successfully authorized the application. You may close this window and return to the application.</p>
    </div>
</body>
</html>
